<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Lens Sandbox — Protron X Design System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Styling for sandbox environment */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient spotlight to test refraction overlay */
    .spotlight {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Grid mesh overlay to test true glass transparency & lens refraction */
    .grid-mesh {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      pointer-events: none;
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      text-align: center;
    }

    .title {
      font-size: 26px;
      font-weight: 500;
      color: #fafafc;
      letter-spacing: -0.02em;
    }

    /* ==========================================================================
       LIQUID GLASS BADGE COMPONENT (PROTRON X DESIGN SYSTEM)
       ========================================================================== */
    .hero-badge-pill {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 9999px;
      text-decoration: none;
      
      /* True transparent background to let underlying content shine through */
      background: rgba(255, 255, 255, 0.01);
      
      /* No physical border line to keep it clean and organic */
      border: none;

      /* REMOVED BLUR: Keep grid lines 100% sharp. Use contrast/brightness to simulate glass lens refraction */
      backdrop-filter: brightness(1.28) contrast(1.18);
      -webkit-backdrop-filter: brightness(1.28) contrast(1.18);

      /* Sharp Liquid 3D Specular Refraction Shadows - no sharp white line borders */
      box-shadow: 
        0 8px 20px rgba(0, 0, 0, 0.6),
        inset 0 -6px 12px -3px rgba(255, 255, 255, 0.02),
        inset 4px 0 8px -3px rgba(0, 0, 0, 0.6),
        inset -4px 0 8px -3px rgba(0, 0, 0, 0.6);

      cursor: pointer;
      user-select: none;
      overflow: hidden;
      transition: 
        transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Semi-transparent Glossy Top Highlight Specular */
    .hero-badge-pill::before {
      content: "";
      position: absolute;
      top: 1px;
      left: 8px;
      right: 8px;
      height: 35%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.15) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      border-radius: 999px 999px 0 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-badge-pill:hover {
      transform: translateY(-2px) scale(1.02);
      background: rgba(255, 255, 255, 0.03);
      box-shadow: 
        0 16px 40px -6px rgba(0, 0, 0, 0.95),
        0 0 35px 4px rgba(255, 255, 255, 0.04),
        inset 0 -8px 16px -3px rgba(255, 255, 255, 0.03),
        inset 8px 0 16px -4px rgba(0, 0, 0, 0.6),
        inset -8px 0 16px -4px rgba(0, 0, 0, 0.6);
    }

    .hero-badge-pill:hover::before {
      opacity: 0.85;
    }

    .hero-badge-pill:active {
      transform: translateY(0) scale(0.98);
    }

    .hero-badge-text {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: -0.1px;
      z-index: 2;
      transition: color 0.3s ease;
    }

    .hero-badge-pill:hover .hero-badge-text {
      color: #ffffff;
    }

    /* Sliding Interactive Arrow */
    .hero-badge-arrow {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.45);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
      z-index: 2;
    }

    .hero-badge-pill:hover .hero-badge-arrow {
      transform: translateX(3px);
      color: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Ambient backdrop lights to demonstrate true transparency -->
  <div class="spotlight"></div>
  <div class="grid-mesh"></div>

  <div class="container">
    <h1 class="title">Protron X Design System Sandbox</h1>
    
    <!-- Liquid Glass Lens Pill Badge -->
    <a href="#" class="hero-badge-pill">
      <span class="hero-badge-text">Now in public beta</span>
      <span class="hero-badge-arrow" aria-hidden="true">→</span>
    </a>
  </div>
</body>
</html>
